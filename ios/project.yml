name: Eidetic
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  Eidetic:
    type: application
    platform: iOS
    sources: [Eidetic]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    info:
      path: Eidetic/Info.plist
      properties:
        CFBundleDisplayName: eidetic
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Injected from Config.xcconfig at build time; read in AppConfig.swift.
        API_BASE_URL: $(API_BASE_URL)
        API_TOKEN: $(API_TOKEN)
        ITSAppUsesNonExemptEncryption: false
  EideticTests:
    type: bundle.unit-test
    platform: iOS
    sources: [EideticTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
    dependencies:
      - target: Eidetic
schemes:
  Eidetic:
    build:
      targets:
        Eidetic: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [EideticTests]
